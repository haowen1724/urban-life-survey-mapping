<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Urban Life Survey Mapping 城市生活調查測繪</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: setup → survey → log → analysis. Three instruments, nine points, bilingual.
   Palette from the lane surface itself: teal paving, red edge line, asphalt. */
:root{
  --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eceee9;
  --ink:#1f2522; --ink-2:#55605a; --ink-3:#8a948e;
  --line:#d6dad4; --line-2:#c2c8c0;
  --accent:#0d7a6b; --accent-soft:#d8ece8;
  --signal:#c7392b; --signal-soft:#f8e2df;
  --warn:#b8761c; --good:#2e7d4f;
  --font-display:'Archivo','Noto Sans TC','Helvetica Neue',Arial,sans-serif;
  --font-body:'IBM Plex Sans','Noto Sans TC','Helvetica Neue',Arial,sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171a19; --surface:#202423; --surface-2:#2a2f2d;
  --ink:#e8ebe8; --ink-2:#a8b2ad; --ink-3:#78827d;
  --line:#343a38; --line-2:#444b48;
  --accent:#4fbfab; --accent-soft:#17352f;
  --signal:#e9705e; --signal-soft:#3a211d;
  --warn:#d79a3f; --good:#5fb380;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#171a19; --surface:#202423; --surface-2:#2a2f2d;
  --ink:#e8ebe8; --ink-2:#a8b2ad; --ink-3:#78827d;
  --line:#343a38; --line-2:#444b48;
  --accent:#4fbfab; --accent-soft:#17352f;
  --signal:#e9705e; --signal-soft:#3a211d;
  --warn:#d79a3f; --good:#5fb380;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.role-surveyor .admin-only{display:none!important}
.syncbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3);padding-bottom:6px}
.syncbar .dotc{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.syncbar.ok .dotc{background:var(--good)}
.syncbar.warn .dotc{background:var(--warn)}
.syncbar.bad .dotc{background:var(--signal)}
.syncbar button{background:none;border:1px solid var(--line-2);border-radius:6px;color:var(--ink-2);font-size:12px;
  font-family:var(--font-body);padding:3px 8px;cursor:pointer;min-height:28px}
.pill.pend{background:var(--warn);color:#fff}
#gate .card{max-width:440px}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1000px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.hint{color:var(--ink-2);font-size:13px;margin:6px 0 0}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px 8px}
.hd h1{font-size:18px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.lang{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.lang button{background:var(--surface-2);border:0;color:var(--ink-2);font-family:var(--font-body);font-size:13px;
  font-weight:600;padding:7px 11px;cursor:pointer;min-height:36px}
.lang button+button{border-left:1px solid var(--line-2)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-2);
  font-family:var(--font-body);font-size:14px;font-weight:500;padding:9px 12px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

main{padding-block:18px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:600;margin-bottom:2px}
.card h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:16px 0 8px}

button.btn{font-family:var(--font-body);font-size:14px;font-weight:600;border-radius:8px;padding:10px 14px;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);cursor:pointer;min-height:42px}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.danger{background:none;border-color:var(--line-2);color:var(--signal)}
button.btn.wide{width:100%}
button.btn:disabled{opacity:.45;cursor:default}
button.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
label.fld{display:block;margin-bottom:12px}
label.fld>span,.flab{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
input[type=text],input[type=number],input[type=datetime-local],select,textarea{width:100%;font-family:var(--font-body);
  font-size:15px;padding:10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:58px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:7px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink-2);cursor:pointer;font-family:var(--font-body);min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip .alt{opacity:.6;font-size:11px;margin-left:4px}

.planbox{position:relative;overflow:auto;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);
  max-height:70vh;-webkit-overflow-scrolling:touch}
.planinner{position:relative;width:100%;transform-origin:0 0}
.planinner img{display:block;width:100%;max-width:100%;height:auto}
.planempty{display:grid;place-items:center;min-height:200px;text-align:center;padding:24px;color:var(--ink-2)}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.pt{width:26px;height:26px;background:var(--signal);color:#fff;font-family:var(--font-mono);font-size:11px;font-weight:600;pointer-events:none}
.pin.person{width:15px;height:15px;border-width:1.5px;cursor:pointer}
.pin.sel{outline:3px solid var(--accent);outline-offset:2px;z-index:5}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.zoom{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.zoom button{background:var(--surface-2);border:0;color:var(--ink);font-family:var(--font-mono);font-size:13px;padding:8px 11px;cursor:pointer;min-height:38px}
.zoom button+button{border-left:1px solid var(--line-2)}
.zoom button[aria-pressed="true"]{background:var(--accent);color:#fff}

.tally{display:grid;gap:5px;margin-top:8px}
.tally .hcell{font-size:11px;color:var(--ink-3);display:flex;align-items:flex-end;justify-content:center;
  text-align:center;padding-bottom:3px;font-weight:600;line-height:1.25}
.tally .rcell{font-size:12px;color:var(--ink-2);display:flex;align-items:center;font-weight:600}
.tally button{border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;cursor:pointer;
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;color:var(--ink);
  padding:12px 4px;min-height:52px}
.tally button:active{background:var(--accent-soft);border-color:var(--accent)}
.tally button.z{color:var(--ink-3);font-weight:400}

.ctr{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--surface)}
.ctr .lab{font-size:12px;color:var(--ink-2);margin-bottom:6px;min-height:30px;display:flex;align-items:flex-start}
.ctr .ops{display:flex;align-items:center;gap:8px}
.ctr .ops button{width:34px;height:34px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface-2);
  color:var(--ink);font-size:17px;font-weight:600;cursor:pointer;flex:0 0 auto}
.ctr .val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;flex:1;text-align:center;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}

.thumb{width:100%;max-width:280px;border-radius:9px;border:1px solid var(--line);display:block}
.pill{display:inline-block;font-size:11px;letter-spacing:.05em;padding:3px 7px;border-radius:5px;
  background:var(--surface-2);color:var(--ink-2);font-weight:600}
.pill.ai{background:var(--signal-soft);color:var(--signal)}
.pill.gps{background:var(--accent-soft);color:var(--accent)}

.sheet{border:1px solid var(--accent);background:var(--surface);border-radius:10px;padding:14px;margin-top:12px}
.plist{display:flex;flex-direction:column;gap:5px;margin-top:10px;max-height:260px;overflow:auto}
.prow{display:flex;gap:9px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.prow .sw{width:13px;height:13px;border-radius:50%;flex:0 0 auto}
.prow .x{margin-left:auto;background:none;border:0;color:var(--signal);cursor:pointer;font-size:17px;padding:0 5px}

.q{border-bottom:1px solid var(--line);padding:11px 0}
.q:last-child{border-bottom:0}
.q .qt{font-size:14px;margin-bottom:3px}
.q .qa{font-size:12px;color:var(--ink-3);margin-bottom:7px}
.face{display:flex;gap:6px}
.face button{flex:1;border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:8px;
  cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);min-height:40px;font-family:var(--font-body)}
.face button[aria-pressed="true"]{color:#fff}
.face button.y[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.face button.p[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.face button.n[aria-pressed="true"]{background:var(--signal);border-color:var(--signal)}

.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.pick button{text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:14px;
  cursor:pointer;font-family:var(--font-body);color:var(--ink)}
.pick button:hover{border-color:var(--accent)}
.pick strong{display:block;font-family:var(--font-display);font-size:15px;margin-bottom:3px}
.pick span{font-size:13px;color:var(--ink-2)}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.05em;color:var(--ink-3);font-weight:600}
td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.scrollx{overflow-x:auto}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--surface-2);margin-top:6px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:block}

.logitem{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.logitem img{width:64px;height:64px;object-fit:cover;border-radius:7px;flex:0 0 auto;border:1px solid var(--line)}
.logitem .meta{min-width:0;flex:1}

.banner{border:1px solid var(--line-2);background:var(--surface-2);border-radius:9px;padding:11px 13px;margin-bottom:14px;font-size:13px;color:var(--ink-2)}
.banner strong{color:var(--ink)}
.timer{font-family:var(--font-mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:9px;font-size:14px;z-index:90;max-width:88vw}
@media (prefers-reduced-motion:no-preference){.toast{animation:rise .18s ease-out}}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}}

.hint,.banner,.toast,.pick span,footer p{white-space:pre-line}
.hd h1 .en{display:block;font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.02em;margin-top:1px}
/* how-to panels */
.howto{border:1px solid var(--line-2);border-radius:10px;background:var(--surface);margin-bottom:14px}
.howto summary{cursor:pointer;padding:12px 16px;display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;list-style:none;font-weight:600;font-size:14px}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"+";font-family:var(--font-mono);color:var(--accent);width:12px;font-weight:600}
.howto[open] summary::before{content:"−"}
.howto summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.howto .sub{font-weight:400;color:var(--ink-3);font-size:13px}
.hbody{padding:0 16px 16px}
.howto ol{margin:12px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.howto li::marker{color:var(--accent);font-family:var(--font-mono);font-weight:600}
.howto li .z{display:block;font-size:14px}
.howto li .e{display:block;font-size:12.5px;color:var(--ink-3)}
.hnote{background:var(--surface-2);border-radius:8px;padding:9px 11px;font-size:13px;color:var(--ink-2);margin:14px 0 0;white-space:pre-line}
.hsrc{font-size:12px;color:var(--ink-3);margin:14px 0 0;white-space:pre-line;border-top:1px solid var(--line);padding-top:10px}
.hsrc a{color:var(--accent)}
figure.dgf{margin:4px 0 0}
figure.dgf figcaption{font-size:12px;color:var(--ink-2);margin-top:6px;white-space:pre-line}
.dg{width:100%;max-width:460px;height:auto;display:block}
.dg text{font-family:var(--font-body);font-size:10px;fill:var(--ink-2)}
.dg .blk{fill:var(--surface-2);stroke:var(--line-2)}
.dg .gate{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5 4}
.dg .flow{stroke:var(--ink-3);stroke-width:1.5;fill:none}
.dg .ahf{fill:var(--ink-3)}
.dg .ahs{fill:var(--signal)}
.dg text.acc{fill:var(--accent);font-weight:600}
.dg .sig{fill:var(--signal)}
.dg .ppl{fill:var(--ink-2)}
.dg .area{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 4}
.dg .walk{stroke:var(--signal);stroke-width:1.6;fill:none;stroke-dasharray:4 3}
.dg .loop{fill:none;stroke:#3a8f9a;stroke-width:1.2;stroke-dasharray:3 2}
.dg .ring{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}
.dg .ink{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round}
.dg .gd{fill:var(--good)} .dg .wn{fill:var(--warn)} .dg .sg{fill:var(--signal)}
.dg .dot{stroke:var(--surface);stroke-width:1.5}
footer{border-top:1px solid var(--line);margin-top:10px;padding-block:20px 40px;font-size:12px;color:var(--ink-3);line-height:1.6}
footer .credit{max-width:62ch}
footer .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
footer .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:5px;
  background:var(--surface-2);color:var(--ink-2)}
footer .tag.beta{background:var(--warn);color:#fff}
footer p{margin:0 0 8px}
footer a{color:var(--accent)}
</style>

</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <h1>城市生活調查測繪<span class="en">Urban Life Survey Mapping</span></h1>
    </div>
    <div class="syncbar" id="syncbar"><span class="dotc"></span><span id="syncText"></span>
      <button type="button" id="syncBtn" hidden></button><button type="button" id="codeBtn" hidden></button></div>
    <nav role="tablist">
      <button role="tab" id="t-set" aria-selected="true"></button>
      <button role="tab" id="t-sur" aria-selected="false"></button>
      <button role="tab" id="t-log" aria-selected="false"></button>
      <button role="tab" id="t-an" aria-selected="false"></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="offline" class="banner" hidden></div>
  <section id="gate" hidden>
    <div class="card">
      <h2 id="h-gate"></h2><p class="hint" id="p-gate"></p>
      <div class="row" style="margin-top:12px">
        <input type="text" id="gateCode" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1;min-width:160px">
        <button class="btn primary" id="gateBtn"></button>
      </div>
      <p class="hint" id="gateErr" style="color:var(--signal)"></p>
    </div>
  </section>

  <section id="v-set">
    <div id="howSet"></div>
    <div class="card">
      <h2 id="h-plan"></h2><p class="hint" id="p-plan"></p>
      <div class="toolbar" style="margin-top:12px">
        <label class="btn admin-only" style="display:inline-flex;align-items:center">
          <span id="planUpLabel"></span><input type="file" id="planFile" accept="image/*" hidden>
        </label>
        <button class="btn" id="addPtBtn" aria-pressed="false"></button>
        <div class="zoom" role="group" aria-label="Zoom">
          <button data-z="1" aria-pressed="true">1&times;</button><button data-z="2" aria-pressed="false">2&times;</button><button data-z="3" aria-pressed="false">3&times;</button>
        </div>
      </div>
      <div class="planbox"><div class="planinner" id="setInner"></div></div>
      <p class="hint" id="setMode"></p>
    </div>
    <div class="card">
      <h2 id="h-stu"></h2><p class="hint" id="p-stu"></p>
      <div id="stuList" style="margin-top:10px"></div>
      <div class="row" style="margin-top:10px">
        <input type="text" id="stuNew" style="flex:1;min-width:140px">
        <button class="btn" id="stuAdd"></button>
      </div>
    </div>
    <div class="card">
      <h2 id="h-pts"></h2><p class="hint" id="p-pts"></p>
      <div id="ptList" style="margin-top:10px"></div>
    </div>
  </section>

  <section id="v-sur" hidden>
    <div id="surPick">
      <div class="card">
        <h2 id="h-cov"></h2><p class="hint" id="p-cov"></p>
        <div class="scrollx" style="margin-top:10px"><table id="covTable"><tbody></tbody></table></div>
      </div>
      <div class="card">
        <h2 id="h-start"></h2><p class="hint" id="p-start"></p>
        <div class="pick" id="pickBox" style="margin-top:14px"></div>
      </div>
    </div>
    <div id="surRun" hidden></div>
  </section>

  <section id="v-log" hidden>
    <div class="card">
      <div class="row spread"><h2 id="h-log"></h2><button class="btn" id="exportBtn"></button></div>
      <div class="chips" id="logFilter" style="margin-top:12px"></div>
      <div id="logList" style="margin-top:6px"></div>
    </div>
  </section>

  <section id="v-an" hidden>
    <div class="card">
      <h2 id="h-stay"></h2><p class="hint" id="p-stay"></p>
      <div class="chips" id="colorBy" style="margin-top:12px"></div>
      <div class="planbox" style="margin-top:12px"><div class="planinner" id="anInner"></div></div>
      <div class="legend" id="anLegend"></div>
    </div>
    <div class="card"><h2 id="h-who"></h2><div id="demoChart" style="margin-top:10px"></div></div>
    <div class="card"><h2 id="h-flow"></h2><p class="hint" id="p-flow"></p><div id="flowChart" style="margin-top:10px"></div></div>
    <div class="card"><h2 id="h-qual"></h2><div id="qualChart" style="margin-top:10px"></div></div>
  </section>

  <footer>
    <div class="credit">
      <div class="tagrow"><span class="tag beta">Beta 測試版</span><span class="tag">Arup</span><span class="tag">NTUT 北科大</span></div>
      <p id="cred1"></p>
      <p id="cred2"></p>

function localIso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function slotOf(iso){var h=new Date(iso).getHours();return h<11?"morning":h<14?"midday":h<18?"afternoon":"evening"}
function dayType(iso){var d=new Date(iso).getDay();return d===0||d===6?"weekend":"weekday"}
function find(list,k){for(var i=0;i<list.length;i++) if(list[i][0]===k) return list[i];return null}
function zh(list,k){var e=find(list,k);return e?e[2]:k}
function en(list,k){var e=find(list,k);return e?e[1]:""}
function lab(list,k){var e=find(list,k);if(!e) return k;return e[1]===e[2]?e[1]:e[2]+" "+e[1]}
function colorOf(list,k){var e=find(list,k);return (e&&e[3])||"#888"}
function typeName(k){return lab(TYPES,k)}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

function shrink(file,maxPx,q){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error("read"))};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){rej(new Error("decode"))};
      img.onload=function(){
        var s=Math.min(1,maxPx/Math.max(img.width,img.height));
        var w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
        var cv=document.createElement("canvas");cv.width=w;cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        res({dataUrl:cv.toDataURL("image/jpeg",q),w:w,h:h,canvas:cv});
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function blobOf(cv,q){return new Promise(function(r){cv.toBlob(function(b){r(b)},"image/jpeg",q)})}

function planSrc(){ return S.plan||null }
function paintPlan(inner,pins,onClick,emptyMsg){
  var src=planSrc();
  if(!src){inner.innerHTML='<div class="planempty"><div><strong>'+esc(T(D.noPlan))+'</strong><p class="hint">'+esc(emptyMsg||T(D.noPlanHint))+'</p></div></div>';return false}
  inner.innerHTML='<img src="'+esc(src)+'" alt="'+esc(T(D.hPlan))+'">'+(pins||"");
  if(onClick) inner.querySelector("img").addEventListener("click",onClick);
  return true;
}
function relXY(ev,inner){
  var img=inner.querySelector("img"); if(!img) return null;
  var r=img.getBoundingClientRect();
  var x=(ev.clientX-r.left)/r.width,y=(ev.clientY-r.top)/r.height;
  return (x<0||x>1||y<0||y>1)?null:{x:x,y:y};
}

function wireMoving(){
  var g=$("tgrid");
  g.querySelectorAll("button[data-k]").forEach(function(b){
    b.addEventListener("click",function(){
      var k=b.dataset.k;run.tally[k]=(run.tally[k]||0)+1;run.undo.push(k);
      b.textContent=run.tally[k];b.classList.remove("z");tTot();
    });
  });
  $("undoBtn").addEventListener("click",function(){
    var k=run.undo.pop(); if(!k){toast(T(D.nothingUndo));return}
    run.tally[k]=Math.max(0,(run.tally[k]||0)-1);
    var b=g.querySelector('button[data-k="'+k+'"]');
    if(b){b.textContent=run.tally[k];if(!run.tally[k])b.classList.add("z")}
    tTot();
  });
  document.querySelectorAll("#surRun .ctr[data-m]").forEach(function(c){
    c.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click",function(){
        var m=c.dataset.m;
        run.modes[m]=Math.max(0,(run.modes[m]||0)+(+b.dataset.d));
        c.querySelector(".val").textContent=run.modes[m];
      });
    });
  });
  $("durMin").addEventListener("change",function(){
    run.dur=Math.max(60,Math.min(3600,(+this.value||5)*60));
    if(!run.running){run.elapsed=0;paintClock()}
  });
  $("startStop").addEventListener("click",function(){
    run.running=!run.running;this.textContent=run.running?T(D.pause):T(D.start);
    if(run.running){timer=setInterval(function(){
      run.elapsed++;paintClock();
      if(run.elapsed>=run.dur){run.running=false;clearInterval(timer);timer=null;
        $("startStop").textContent=T(D.start);toast(T(D.periodDone))}
    },1000)}
    else if(timer){clearInterval(timer);timer=null}
  });
  paintClock();tTot();
}
function paintClock(){
  var left=Math.max(0,run.dur-run.elapsed),c=$("clock");
  if(c) c.textContent=pad(Math.floor(left/60))+":"+pad(left%60);
}
function tTot(){var t=0;for(var k in run.tally) t+=run.tally[k];var e=$("tTotal");if(e)e.textContent=t}

    '</div><div class="plist" id="pList"></div></div>';
}
function wireStationary(){
  renderStPlan();
  renderPList();
}
function renderStPlan(){
  var pt=S.pts.filter(function(p){return p.id===run.pointId})[0];
  var pins=(pt?'<div class="pin pt" style="left:'+(pt.x*100).toFixed(3)+'%;top:'+(pt.y*100).toFixed(3)+'%">'+esc(String(pt.n||""))+'</div>':"")+
    run.people.map(function(p,i){
      return '<div class="pin person'+(run.sel===i?" sel":"")+'" data-i="'+i+'" style="left:'+(p.x*100).toFixed(3)+'%;top:'+(p.y*100).toFixed(3)+
        '%;background:'+colorOf(POST,p.posture)+'"></div>';
    }).join("");
  var inner=$("stInner"); if(!inner) return;
  paintPlan(inner,pins,function(ev){
    var p=relXY(ev,inner); if(!p) return;
    run.people.push({x:p.x,y:p.y,age:"25-44",gender:"u",posture:"standing",acts:[],group:1,prop:"none",assist:false});
    run.sel=run.people.length-1;
    renderStPlan();renderSheet();renderPList();
  });
  inner.querySelectorAll(".pin.person").forEach(function(el){
    el.addEventListener("click",function(ev){ev.stopPropagation();run.sel=+el.dataset.i;renderStPlan();renderSheet()});
  });
  var c=$("pCount"); if(c) c.textContent=run.people.length;
}
function renderSheet(){
  var box=$("stSheet"); if(!box) return;
  if(run.sel==null||!run.people[run.sel]){box.innerHTML="";return}
  var p=run.people[run.sel];
  function chips(id,list,sel,multi){
    return '<div class="chips" id="'+id+'">'+list.map(function(o){
      var on=multi?(sel.indexOf(o[0])>=0):(sel===o[0]);
      var main=zh(list,o[0]),a=en(list,o[0]);
      return '<button class="chip" type="button" data-v="'+o[0]+'" aria-pressed="'+on+'">'+esc(main)+
        (a&&a!==main?'<span class="alt">'+esc(a)+'</span>':"")+'</button>';
    }).join("")+'</div>';
  }
  box.innerHTML='<div class="sheet"><div class="row spread"><strong>'+esc(T(D.person))+' '+(run.sel+1)+'</strong>'+
    '<button class="btn danger" id="delP" style="padding:6px 10px;min-height:34px">'+esc(T(D.del))+'</button></div>'+
    '<h3>'+esc(T(D.age))+'</h3>'+chips("cAge",AGES,p.age)+
    '<h3>'+esc(T(D.gender))+'</h3>'+chips("cGen",GEN,p.gender)+
    '<h3>'+esc(T(D.posture))+'</h3>'+chips("cPost",POST,p.posture)+
    '<h3>'+esc(T(D.doing))+'</h3>'+chips("cAct",ACTS,p.acts,true)+
    '<h3>'+esc(T(D.withW))+'</h3>'+chips("cProp",PROPS,p.prop)+
    '<h3>'+esc(T(D.groupMob))+'</h3><div class="row">'+
      '<label style="flex:1;min-width:120px"><span class="flab">'+esc(T(D.groupSize))+'</span>'+
      '<input type="number" id="pGroup" min="1" max="20" value="'+(p.group||1)+'"></label>'+
      '<button class="chip" type="button" id="pAssist" aria-pressed="'+(!!p.assist)+'" style="margin-top:18px">'+esc(T(D.usingAid))+'</button></div>'+
    '<button class="btn wide" id="doneP" style="margin-top:12px">'+esc(T(D.done))+'</button></div>';
  function bind(id,field,multi){
    var c=$(id); if(!c) return;
    c.querySelectorAll(".chip").forEach(function(b){
      b.addEventListener("click",function(){
        var v=b.dataset.v;
        if(multi){
          var i=p[field].indexOf(v);
          if(i>=0) p[field].splice(i,1); else p[field].push(v);
          c.querySelectorAll(".chip").forEach(function(o){o.setAttribute("aria-pressed",p[field].indexOf(o.dataset.v)>=0?"true":"false")});
        }else{
          p[field]=v;
          c.querySelectorAll(".chip").forEach(function(o){o.setAttribute("aria-pressed",o.dataset.v===v?"true":"false")});
          if(field==="posture") renderStPlan();
        }
        renderPList();
      });
    });
  }
  bind("cAge","age");bind("cGen","gender");bind("cPost","posture");bind("cAct","acts",true);bind("cProp","prop");
  $("pGroup").addEventListener("change",function(){p.group=Math.max(1,+this.value||1)});
  $("pAssist").addEventListener("click",function(){p.assist=!p.assist;this.setAttribute("aria-pressed",p.assist?"true":"false")});
  $("delP").addEventListener("click",function(){run.people.splice(run.sel,1);run.sel=null;renderStPlan();renderSheet();renderPList()});
  $("doneP").addEventListener("click",function(){run.sel=null;renderStPlan();renderSheet()});
}
function renderPList(){
  var L=$("pList"); if(!L) return;
  if(!run.people.length){L.innerHTML='<p class="hint">'+esc(T(D.noPlot))+'</p>';return}
  L.innerHTML="";
  run.people.forEach(function(p,i){
    var d=document.createElement("div");d.className="prow";
    d.innerHTML='<span class="sw" style="background:'+colorOf(POST,p.posture)+'"></span>'+
      '<span class="mono muted" style="font-size:11px">'+(i+1)+'</span>'+
      '<span style="cursor:pointer">'+esc(lab(AGES,p.age))+' · '+esc(lab(GEN,p.gender))+' · '+esc(lab(POST,p.posture))+
      (p.acts.length?' · '+esc(p.acts.map(function(a){return lab(ACTS,a)}).join(", ")):"")+'</span>'+
      '<button class="x" aria-label="×">&times;</button>';
    d.querySelectorAll("span")[2].addEventListener("click",function(){run.sel=i;renderStPlan();renderSheet()});
    d.querySelector(".x").addEventListener("click",function(){run.people.splice(i,1);if(run.sel===i)run.sel=null;renderStPlan();renderSheet();renderPList()});
    L.appendChild(d);
  });

/* ---------- render + save ---------- */
function renderRun(){
  var body=run.type==="moving"?movingBody():run.type==="stationary"?stationaryBody():qualityBody();
  $("surRun").innerHTML=headerBlock()+howHtml(run.type)+body+notesBlock();
  wireCommon();
  if(run.type==="moving") wireMoving();
  else if(run.type==="stationary") wireStationary();
  else wireQuality();
}
function saveRun(){
  var pt=S.pts.filter(function(p){return p.id===run.pointId})[0];
  if(!pt){toast(T(D.needPt));return}
  var ts=new Date($("runTime").value||run.ts).toISOString();
  var local=$("runTime").value||run.ts;
  var who=MYNAME||pt.student||null;
  var rec={id:newId("r"),type:run.type,pointId:pt.id,pointName:pt.name,student:who,surveyorName:who||"",
    ts:ts,tsLocal:local.replace("T"," "),slot:slotOf(ts),dayType:dayType(ts),wx:run.wx||null,notes:run.notes||null,
    device:DEVICE};
  if(run.type==="moving"){
    var t=0;for(var k in run.tally) t+=run.tally[k];
    if(!t){toast(T(D.needTally));return}
    rec.tally=run.tally;rec.modes=run.modes;rec.total=t;rec.durationSec=run.dur;rec.countedSec=Math.min(run.elapsed||run.dur,run.dur);
  }else if(run.type==="stationary"){
    if(!run.people.length){toast(T(D.needPerson));return}
    rec.people=run.people;rec.total=run.people.length;
  }else{
    var n=Object.keys(run.scores).length;
    if(!n){toast(T(D.needScore));return}
    rec.scores=run.scores;rec.scored=n;
    rec.total=Object.keys(run.scores).reduce(function(a,kk){return a+run.scores[kk]},0);
  }
  var ob=loadOutbox();ob.push(rec);saveOutbox(ob);
  toast(T(D.savedLocal));endRun();mergeRecs();renderAll();flushOutbox();
}

/* ---------- log ---------- */
function renderLog(){
  var f=$("logFilter");
  f.innerHTML="";
  [["all",T(D.all)]].concat(TYPES.map(function(t){return [t[0],typeName(t[0])]})).forEach(function(p){

    b.addEventListener("click",function(){logFilter=p[0];renderLog()});
    f.appendChild(b);
  });
  var rows=S.recs.filter(function(o){return logFilter==="all"||o.type===logFilter}).sort(function(a,b){return a.ts<b.ts?1:-1});
  var L=$("logList");
  if(!rows.length){L.innerHTML='<p class="hint">'+esc(T(D.nothingYet))+'</p>';return}
  L.innerHTML="";
  rows.forEach(function(o){
    var d=document.createElement("div");d.className="logitem";

    }else if(o.type==="quality"){

    }

    d.innerHTML=
      '<div class="meta"><span class="pill">'+esc(typeName(o.type))+'</span> <strong>'+esc(o.pointName||"—")+'</strong>'+
      (o.student?' <span class="muted">· '+esc(o.student)+'</span>':"")+'<br>'+

      '<span class="mono" style="font-size:17px;font-weight:600">'+esc(unit)+'</span> '+

      extra+(o.notes?'<p class="hint">'+esc(o.notes)+'</p>':"")+
      ((ROLE==="admin"||o.pending||o.device===DEVICE)?
        '<div style="margin-top:8px"><button class="btn danger delrec" type="button" style="padding:5px 10px;min-height:32px;font-size:12px">'+
        esc(T(D.del))+'</button></div>':"")+'</div>';
    var db_=d.querySelector(".delrec"),armT=null;
    if(db_) db_.addEventListener("click",function(){
      if(!db_.dataset.armed){
        db_.dataset.armed="1";db_.textContent=T(D.delConfirm);
        db_.style.background="var(--signal)";db_.style.color="#fff";db_.style.borderColor="var(--signal)";
        armT=setTimeout(function(){delete db_.dataset.armed;db_.textContent=T(D.del);
          db_.style.background="";db_.style.color="";db_.style.borderColor=""},4000);
        return;
      }
      clearTimeout(armT);db_.disabled=true;
      if(o.pending){
        saveOutbox(loadOutbox().filter(function(x){return x.id!==o.id}));
        toast(T(D.recDeleted));mergeRecs();renderAll();return;
      }
      apiPost({action:"deleteRecord",id:o.id,device:DEVICE}).then(function(res){
        if(!res.ok){db_.disabled=false;toast(res.error==="not_yours"?T(D.notYours):T(D.delFail));return}
        toast(T(D.recDeleted));refresh();
      }).catch(function(){db_.disabled=false;toast(T(D.netFail))});
    });
    L.appendChild(d);
  });
}

    s[1].forEach(function(o){out.push([o[0],s[0],o[1],o[2]].map(csvCell).join(","))});
  });
  WX.forEach(function(w){out.push([w[0],"weather",w[0],w[1]].map(csvCell).join(","))});
  QUAL.forEach(function(g,gi){g[1].forEach(function(q,qi){
    out.push(["q"+gi+"_"+qi,g[0][0],q[0],q[1]].map(csvCell).join(","))})});
  var csv=out.join("\n");
  try{
    var blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="urban-life-survey-"+localIso(new Date()).slice(0,10)+".csv";
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
    toast(T(D.csvSaved));
  }catch(e){toast(T(D.csvFail))}
});

/* ---------- analysis ---------- */
function drawAnalysis(){
  var cb=$("colorBy");
  cb.innerHTML="";
  [["posture",T(D.byPosture)],["age",T(D.byAge)],["gender",T(D.byGender)]].forEach(function(o){
    var b=document.createElement("button");b.className="chip";b.type="button";b.dataset.v=o[0];b.textContent=o[1];
    b.setAttribute("aria-pressed",colorBy===o[0]?"true":"false");
    b.addEventListener("click",function(){colorBy=o[0];drawAnalysis()});
    cb.appendChild(b);
  });
  var people=[];
  S.recs.filter(function(r){return r.type==="stationary"}).forEach(function(r){(r.people||[]).forEach(function(p){people.push(p)})});
  var AGEC=["#d9e8f5","#9dc6e4","#5b9bcc","#2d6ca2","#1c4a74","#0f2d49"];
  var GENC={f:"#c7392b",m:"#2d6ca2",u:"#8a948e"};
  function pColor(p){
    if(colorBy==="posture") return colorOf(POST,p.posture);
    if(colorBy==="gender") return GENC[p.gender]||"#888";
    for(var i=0;i<AGES.length;i++) if(AGES[i][0]===p.age) return AGEC[i];
    return "#888";
  }
  paintPlan($("anInner"),people.map(function(p){
    return '<div class="pin person" style="left:'+(p.x*100).toFixed(3)+'%;top:'+(p.y*100).toFixed(3)+'%;background:'+pColor(p)+'"></div>';
  }).join(""),null,T(D.needPlanAn));
  var lg=colorBy==="posture"?POST.map(function(p){return [lab(POST,p[0]),p[3]]}):
         colorBy==="gender"?GEN.map(function(g){return [lab(GEN,g[0]),GENC[g[0]]]}):
         AGES.map(function(a,i){return [a[1],AGEC[i]]});
  $("anLegend").innerHTML=people.length?lg.map(function(l){return '<span><i style="background:'+l[1]+'"></i>'+esc(l[0])+'</span>'}).join(""):"";

  var dc=$("demoChart");
  if(!people.length) dc.innerHTML='<p class="hint">'+esc(T(D.noStay))+'</p>';
  else{
    var h="";
    [[T(D.age),AGES,"age",function(i){return AGEC[i]}],
     [T(D.gender),GEN,"gender",function(i,k){return GENC[k]}],
     [T(D.posture),POST,"posture",function(i,k){return colorOf(POST,k)}]].forEach(function(dim){
      var counts={};people.forEach(function(p){counts[p[dim[2]]]=(counts[p[dim[2]]]||0)+1});
      h+='<h3>'+esc(dim[0])+'</h3><div class="bar" style="height:14px">'+
        dim[1].map(function(o,i){var n=counts[o[0]]||0;
          return n?'<i style="width:'+(n/people.length*100)+'%;background:'+dim[3](i,o[0])+'"></i>':""}).join("")+'</div>'+
        '<div class="legend">'+dim[1].map(function(o,i){var n=counts[o[0]]||0;
          return n?'<span><i style="background:'+dim[3](i,o[0])+'"></i>'+esc(lab(dim[1],o[0]))+' '+n+'</span>':""}).join("")+'</div>';
    });
    var acts={};people.forEach(function(p){(p.acts||[]).forEach(function(a){acts[a]=(acts[a]||0)+1})});
    var ak=Object.keys(acts).sort(function(a,b){return acts[b]-acts[a]});
    if(ak.length) h+='<h3>'+esc(T(D.activities))+'</h3><table><tbody>'+ak.map(function(k){
      return '<tr><td>'+esc(lab(ACTS,k))+'</td><td class="n">'+acts[k]+'</td></tr>'}).join("")+'</tbody></table>';
    dc.innerHTML=h;
  }

  var fc=$("flowChart"),mv=S.recs.filter(function(r){return r.type==="moving"});
  if(!mv.length) fc.innerHTML='<p class="hint">'+esc(T(D.noMove))+'</p>';
  else{
    var byPt={};
    mv.forEach(function(r){(byPt[r.pointName]=byPt[r.pointName]||[]).push(r.total/(r.countedSec||r.durationSec||300)*3600)});
    var names=Object.keys(byPt),mx=0;
    names.forEach(function(n){byPt[n].forEach(function(v){if(v>mx)mx=v})});
    fc.innerHTML=names.map(function(n){
      var avg=byPt[n].reduce(function(a,b){return a+b},0)/byPt[n].length;
      return '<div style="margin-bottom:11px"><div class="row spread"><strong style="font-size:14px">'+esc(n)+'</strong>'+
        '<span class="mono">'+Math.round(avg)+' <span class="muted" style="font-size:12px">'+esc(T(D.perHour))+'</span></span></div>'+
        '<div class="bar" style="height:11px"><i style="width:'+(avg/(mx||1)*100)+'%;background:var(--accent)"></i></div></div>';
    }).join("")+'<p class="hint">'+esc(T(D.avgOf))+' '+mv.length+' '+esc(T(D.countPeriods))+'</p>';
  }

  var qc=$("qualChart"),qs=S.recs.filter(function(r){return r.type==="quality"});
  if(!qs.length) qc.innerHTML='<p class="hint">'+esc(T(D.noQual))+'</p>';
  else{
    var h2="";
    QUAL.forEach(function(g,gi){
      h2+='<h3>'+esc(T(g[0]))+'</h3>';
      g[1].forEach(function(q,qi){
        var k="q"+gi+"_"+qi,vals=qs.map(function(r){return (r.scores||{})[k]}).filter(function(v){return v!=null});
        if(!vals.length) return;
        var avg=vals.reduce(function(a,b){return a+b},0)/vals.length;
        var col=avg>=1.5?"var(--good)":avg>=.75?"var(--warn)":"var(--signal)";
        h2+='<div style="margin-bottom:9px"><div class="row spread"><span style="font-size:13px">'+esc(T(q))+'</span>'+
          '<span class="mono muted" style="font-size:12px">'+avg.toFixed(1)+'</span></div>'+
          '<div class="bar" style="height:8px"><i style="width:'+(avg/2*100)+'%;background:'+col+'"></i></div></div>';
      });
    });
    qc.innerHTML=h2+'<p class="hint">'+esc(T(D.meanOf))+' '+qs.length+' '+esc(T(D.walkthroughs))+'</p>';
  }


}

/* ---------- sheet API ---------- */
function apiGet(params){
  var q=Object.keys(params).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k])}).join("&");
  return fetch(API+(API.indexOf("?")>=0?"&":"?")+q,{method:"GET",redirect:"follow",cache:"no-store"})
    .then(function(r){if(!r.ok) throw new Error("http "+r.status);return r.json()});
}
function apiPost(body){
  body.k=CODE;
  // text/plain keeps this a "simple" request, so Apps Script needs no CORS preflight
  return fetch(API,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    .then(function(r){if(!r.ok) throw new Error("http "+r.status);return r.json()});
}
function call(body,onOk,failMsg){
  setSync("warn",T(D.syncing));
  apiPost(body).then(function(res){
    if(!res.ok){
      toast(res.error==="admin_only"?T(D.adminOnly):res.error==="not_yours"?T(D.notYoursPt):
            res.error==="no_name"?T(D.needName):(failMsg||T(D.saveFail)));
      setSync();return;
    }
    if(onOk) onOk(res);
    refresh();
  }).catch(function(){toast(T(D.netFail));setSync("bad")});
}
function adminCall(body,onOk,failMsg){
  if(ROLE!=="admin"){toast(T(D.adminOnly));return}
  call(body,onOk,failMsg);
}
function mergeRecs(){
  var ids={},out=[];
  S.server.forEach(function(r){ids[r.id]=1;out.push(r)});
  loadOutbox().forEach(function(r){if(!ids[r.id]){var c=Object.assign({},r);c.pending=true;out.push(c)}});
  S.recs=out;
}
function renderAll(){
  document.body.classList.toggle("role-surveyor",ROLE!=="admin");
  renderSetup();renderLog();
  if(!$("v-an").hidden) drawAnalysis();
  setSync();
}
function setSync(state,text){
  var bar=$("syncbar"),n=loadOutbox().length;
  if(!state) state=!online?"bad":n?"warn":"ok";
  bar.className="syncbar "+state;
  var t=text||(!online?T(D.offlineS):T(D.synced)+(lastSync?" "+pad(lastSync.getHours())+":"+pad(lastSync.getMinutes()):""));
  if(n) t+=" · "+n+" "+T(D.waiting);
  if(ROLE) t+=" · "+T(ROLE==="admin"?D.roleAdmin:D.roleSurv)+(MYNAME?" "+MYNAME:"");
  $("syncText").textContent=t;
  $("syncBtn").hidden=!(n||!online);$("syncBtn").textContent=T(D.retry);
  $("codeBtn").hidden=!CODE;$("codeBtn").textContent=T(D.changeCode);
}
function flushOutbox(){
  var ob=loadOutbox(); if(!ob.length||!CODE) return Promise.resolve();
  var next=ob[0];
  return apiPost({action:"addRecord",record:next}).then(function(res){
    if(res.ok||res.error==="bad_record"||res.error==="bad_id"||res.error==="unknown_point"||res.error==="no_people"||res.error==="no_scores"){
      saveOutbox(loadOutbox().filter(function(x){return x.id!==next.id}));
      if(!res.ok) toast(T(D.saveFail)+" ("+res.error+")");
      return flushOutbox();
    }
    throw new Error(res.error||"upload");
  }).then(function(){return refresh()}).catch(function(){online=false;setSync()});
}
function refresh(force){
  if(!API||!CODE||busy) return Promise.resolve();
  busy=true;
  return apiGet({k:CODE,action:"all"}).then(function(res){
    busy=false;
    if(!res.ok){
      if(res.error==="bad_code"){LS.del("uls_code");CODE="";ROLE="";showGate(T(D.gateBad));}
      return;
    }
    online=true;lastSync=new Date();ROLE=res.role;
    S.pts=(res.points||[]).map(function(p){p.student=p.surveyor||"";return p}).sort(function(a,b){return a.n-b.n});
    S.team=res.surveyors||[];
    S.server=res.records||[];
    mergeRecs();
    var wantPlan=res.planVersion&&(force||res.planVersion!==S.planVersion);
    if(!res.planVersion){S.plan=null;S.planVersion=""}
    renderAll();
    if(wantPlan) return loadPlan(res.planVersion);
  }).catch(function(){busy=false;online=false;setSync()});
}
function loadPlan(version){
  var cached=LS.get("uls_plan_v")===version?LS.get("uls_plan"):null;
  if(cached){S.plan=cached;S.planVersion=version;renderAll();return Promise.resolve()}
  return apiGet({k:CODE,action:"plan"}).then(function(res){
    if(res.ok&&res.plan){
      S.plan=res.plan.dataUrl;S.planVersion=res.plan.version;
      LS.set("uls_plan",S.plan);LS.set("uls_plan_v",S.planVersion);
      renderAll();
    }
  }).catch(function(){});
}
function showGate(err){
  $("gate").hidden=false;
  ["v-set","v-sur","v-log","v-an"].forEach(function(id){$(id).hidden=true});
  document.querySelector("nav").hidden=true;
  $("h-gate").textContent=T(D.hGate);$("p-gate").textContent=T(D.pGate);
  $("gateBtn").textContent=T(D.gateBtn);$("gateErr").textContent=err||"";
  setSync("bad",T(D.offlineS));
}
function enter(code){
  CODE=code;LS.set("uls_code",code);
  $("gate").hidden=true;document.querySelector("nav").hidden=false;
  $("t-set").click();
  refresh(true).then(flushOutbox);
}
$("gateBtn").addEventListener("click",function(){var v=$("gateCode").value.trim();if(v) enter(v)});
$("gateCode").addEventListener("keydown",function(e){if(e.key==="Enter") $("gateBtn").click()});
$("syncBtn").addEventListener("click",function(){online=true;setSync("warn",T(D.syncing));flushOutbox().then(function(){return refresh()})});
$("codeBtn").addEventListener("click",function(){LS.del("uls_code");CODE="";ROLE="";showGate("")});
window.addEventListener("online",function(){online=true;flushOutbox()});
window.addEventListener("offline",function(){online=false;setSync()});
setInterval(function(){if(document.visibilityState==="visible"){flushOutbox();refresh()}},45000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible") refresh()});

/* ---------- boot ---------- */
paintStatic();mergeRecs();renderAll();
function offline(m){var b=$("offline");b.hidden=false;b.innerHTML=m}
(function boot(){
  if(!API){offline(esc(T(D.notConfigured)));setSync("bad",T(D.offlineS));return}
  // the code can arrive in the link (?k=… or #k=…); keep it, then tidy it out of the address bar
  var m=/[?&#]k=([A-Za-z0-9]+)/.exec(location.search+location.hash);
  if(m){LS.set("uls_code",m[1]);try{history.replaceState(null,"",location.pathname)}catch(e){}}
  var c=LS.get("uls_code");
  if(c) enter(c); else showGate("");
})();
})();
</script>
